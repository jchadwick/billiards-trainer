services:
  backend:
    image: ${BILLIARDS_TRAINER_IMAGE:-billiards-trainer:dev}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: application
      additional_contexts:
        model_assets: ${MODEL_DIRECTORY:-./models}
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - billiards-data:/app/backend/calibration_data
    environment:
      ENVIRONMENT: production
      HTTP_BIND: 0.0.0.0
      HTTP_PORT: "8000"
      SCENE_BIND: 127.0.0.1
      SCENE_PORT: "49321"
      PROJECT_ROOT: /app
      WEB_ROOT: /app/web
      LIVE_EXECUTABLE: /app/bin/billiards-perception-live
      CAPTURE_HELPER_EXECUTABLE: /app/bin/billiards-perception-gstreamer-probe
      START_LIVE: ${START_LIVE:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  billiards-data:
