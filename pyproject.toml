[project]
name = "billiards-model-tools"
version = "0.1.0"
description = "Optional ONNX export utility for the Rust billiards detector"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model-export = [
    "onnx>=1.17.0",
    "onnxruntime>=1.23.0",
    "ultralytics>=8.0.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
