# Backend import, formatting, and hardware-free regression checks.
name: Backend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "requirements.txt"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "requirements.txt"

env:
  PYTHON_VERSION: "3.11"

permissions: {}

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public source without credentials
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git -c credential.helper= fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git -c credential.helper= fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install quality tools and backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install black==25.9.0 isort==5.12.0 ruff==0.17.1 mypy==1.18.2 types-psutil==7.2.2.20260906

      - name: Check Ruff rules
        run: python -m ruff check backend

      - name: Check strict backend types
        if: ${{ !cancelled() }}
        run: python -m mypy --strict --python-version 3.11 backend

      - name: Check Black formatting
        if: ${{ !cancelled() }}
        run: python -m black --check --diff backend

      - name: Check import sorting
        if: ${{ !cancelled() }}
        run: python -m isort --check-only --diff backend

  tests:
    name: Backend Tests and Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public source without credentials
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git -c credential.helper= fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git -c credential.helper= fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender-dev libgomp1

      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Collect all backend tests
        run: python -m pytest --collect-only --no-cov backend/tests

      - name: Run focused integration contracts
        run: python -m pytest backend/tests/integration -m integration --no-cov

      - name: Run focused system contracts
        run: python -m pytest backend/tests/system -m "system and not hardware" --no-cov

      - name: Run hardware-free tests with coverage
        run: >-
          python -m pytest backend/tests
          -m "not slow and not hardware and not model_assets"
          --cov-report=xml:backend/coverage.xml
          --cov-report=html:backend/coverage-html
          --junitxml=backend/junit.xml
