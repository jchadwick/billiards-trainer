name: Model Export Tool Checks

on:
  push:
    branches: [main, develop]
    paths:
      - "tools/**"
      - "perception/contracts/model-export/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "tools/**"
      - "perception/contracts/model-export/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: model-export-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Verify the ONNX exporter contract
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch public source without credentials
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git -c credential.helper= fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git -c credential.helper= fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.9.26"

      - name: Install exporter test dependencies
        run: uv sync --locked --group dev

      - name: Test model exporter and shared Rust manifest contract
        run: uv run --locked --no-sync python -m pytest tools/tests
