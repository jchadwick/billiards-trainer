name: Build Docker Images

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

# Workflows need no repository, package, or deployment permissions. Source is
# fetched anonymously because this repository is public.
permissions: {}

jobs:
  build:
    name: Build Rust application image (no publishing)
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public source without credentials
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git -c credential.helper= fetch --no-tags --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git -c credential.helper= fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout --quiet --detach FETCH_HEAD

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Rust server and embedded browser bundle locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: billiards-trainer:ci

      - name: Start container and verify gateway health and live app
        env:
          DOCKER_IMAGE: billiards-trainer:ci
        run: bash scripts/tooling/docker-runtime-smoke.sh
